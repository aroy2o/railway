[pytest]
testpaths = tests
pythonpath = .
# `live` tests hit the real Claude API: they cost money, need ANTHROPIC_API_KEY,
# and are non-deterministic. Excluded by default so the ordinary suite stays
# fast and offline; run them with `pytest -m live`.
markers =
    live: hits the real Claude API; requires ANTHROPIC_API_KEY
addopts = -q -m "not live"
